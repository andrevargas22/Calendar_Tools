# Casos de teste para seleção de tool: frase -> tool esperada.
# expected_tool: "search_events" | "create_event" | "update_event" | "delete_event" | "none"
# "none" cobre papo fora de escopo. Pedidos vagos (sem título/horário exatos)
# esperam search_events, já que o primeiro passo do fluxo é encontrar o
# evento antes de poder chamar delete_event/update_event.

- input: "o que eu tenho essa semana?"
  expected_tool: search_events
- input: "marca reunião com o João amanhã às 10h até 11h"
  expected_tool: create_event
- input: "quais eventos eu tenho na sexta-feira?"
  expected_tool: search_events
- input: "agenda um almoço com a Maria sexta às 12h30 por 1 hora"
  expected_tool: create_event
- input: "o que eu tenho marcado para hoje?"
  expected_tool: search_events
- input: "cria um evento 'Dentista' amanhã de manhã às 9h até 10h"
  expected_tool: create_event
- input: "cancela minha reunião de amanhã"
  expected_tool: search_events
- input: "remove o evento 'Dentista' de amanhã das 9h às 10h da minha agenda"
  expected_tool: delete_event
- input: "muda o horário da minha reunião de sexta para as 15h"
  expected_tool: search_events
- input: "muda o evento 'Dentista' de amanhã das 9h às 10h para as 15h às 16h"
  expected_tool: update_event
- input: "marca consulta veterinária do Quico sexta às 14h até 15h"
  expected_tool: create_event
- input: "cancela a vacina da Bibi de amanhã das 10h às 11h"
  expected_tool: delete_event
- input: "oi, tudo bem?"
  expected_tool: none
- input: "qual a capital da França?"
  expected_tool: none
